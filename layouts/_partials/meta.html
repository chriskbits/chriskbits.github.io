<p class="meta">
  {{- if eq .Section "blog" }}
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time>
  {{- else if .Lastmod }}
    Zuletzt aktualisiert: <time datetime="{{ .Lastmod.Format "2006-01-02" }}">{{ .Lastmod | time.Format ":date_long" }}</time>
  {{- end }}
  {{- with .GetTerms "tags" }} ·
    {{ range $i, $t := . }}{{ if $i }}, {{ end }}<a class="tag" href="{{ $t.RelPermalink }}">#{{ $t.LinkTitle }}</a>{{ end }}
  {{- end }}
</p>
